[package]
name = "pointspeak"
description = "PointSpeak: ditado por voz local com HUD no cursor."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# O sufixo `_lib` evita conflito de nome com o binário no Windows.
name = "pointspeak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.18"
pointspeak-core = { path = "../crates/pointspeak-core" }
# Download dos modelos: rustls (ring) em vez de OpenSSL, para o build cruzado do Windows.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = "1"
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[package]
name = "pointspeak"
description = "PointSpeak: ditado por voz local com HUD no cursor."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# O sufixo `_lib` evita conflito de nome com o binário no Windows.
name = "pointspeak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Clipboard do injector (texto e imagem, para salvar e restaurar o do usuário).
arboard = "3.7"
cpal = "0.18"
# Só com a feature `vulkan`: confere se o loader do Vulkan existe (detecção de hardware).
libloading = { version = "0.9", optional = true }
# Teclas simuladas da colagem (Ctrl+V / Shift+Insert). No Linux, X11 via x11rb (sem libxdo).
enigo = "0.6"
log = "0.4"
# Núcleos físicos para as threads do whisper.cpp.
num_cpus = "1"
# ONNX Runtime carregado em tempo de execução (`load-dynamic`): nada é baixado nem linkado no build;
# a biblioteca vem do `ORT_DYLIB_PATH`, da pasta de recursos ou de junto do executável (veja
# `src/onnx.rs`). `api-24` = ONNX Runtime 1.24+ (o `scripts/fetch-onnxruntime.sh` baixa a 1.24.4).
ort = { version = "=2.0.0-rc.14", default-features = false, features = [
    "api-24",
    "cuda",
    "directml",
    "load-dynamic",
    "openvino",
    "std",
] }
pointspeak-core = { path = "../crates/pointspeak-core" }
# Download dos modelos: rustls (ring) em vez de OpenSSL, para o build cruzado do Windows.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = "1"
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
thiserror = "2"
# whisper.cpp estático; padrão = CPU. Logs do whisper.cpp vão para o `log` (veja `transcriber.rs`).
whisper-rs = { version = "0.16", features = ["log_backend"] }

# Win32: mostrar o HUD sem ativar a janela (`ShowWindow(SW_SHOWNOACTIVATE)`, veja `src/hud.rs`).
# Mesma versão que o Tauri usa, para o `HWND` do `WebviewWindow::hwnd()` ser o mesmo tipo.
[target.'cfg(windows)'.dependencies]
# Injector: `GetForegroundWindow` → processo (`OpenProcess` + `QueryFullProcessImageNameW`).
# Atalho de toque duplo (`double_tap.rs`): hook `WH_KEYBOARD_LL` e `SendInput`.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Injector no X11: janela ativa (`_NET_ACTIVE_WINDOW`) → `WM_CLASS`. Mesma versão que o enigo usa.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[dev-dependencies]
hound = "3"
tempfile = "3"

[features]
default = []
# Aceleração do whisper.cpp por GPU: opcionais, desligadas por padrão e fora do .exe.
cuda = ["whisper-rs/cuda"]
vulkan = ["dep:libloading", "whisper-rs/vulkan"]

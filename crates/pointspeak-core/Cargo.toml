[package]
name = "pointspeak-core"
description = "Núcleo do PointSpeak em Rust puro (sem dependências de sistema)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
realfft = "3"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
